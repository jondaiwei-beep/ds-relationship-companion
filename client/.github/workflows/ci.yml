name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Kotlin / Spring Boot)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dsapp_it
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'          # must match /opt/jdk21 on the server
      - uses: gradle/actions/setup-gradle@v4

      - name: Schema contract check
        env: { PGPASSWORD: postgres }
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          psql -h localhost -p 5433 -U postgres -d postgres -c "DROP DATABASE IF EXISTS dsapp_schema_verify;"
          psql -h localhost -p 5433 -U postgres -d postgres -c "CREATE DATABASE dsapp_schema_verify;"
          for m in backend/src/main/resources/db/migration/V*.sql; do
            psql -h localhost -p 5433 -U postgres -d dsapp_schema_verify -v ON_ERROR_STOP=1 -f "$m"
          done
          psql -h localhost -p 5433 -U postgres -d dsapp_schema_verify \
            -f backend/src/test/resources/schema_constraints_test.sql 2>/tmp/verify.err || true
          n=$(grep -c "^psql.*ERROR" /tmp/verify.err || true)
          if [ "$n" -ne 6 ]; then
            echo "::error::expected 6 constraint rejections, got $n"; cat /tmp/verify.err; exit 1
          fi
          grep -q "append-only" /tmp/verify.err || { echo "::error::append-only trigger not enforced"; exit 1; }
          psql -h localhost -p 5433 -U postgres -d dsapp_schema_verify \
            -f backend/src/test/resources/auth_constraints_test.sql >/tmp/v2.out 2>/tmp/v2.err || true
          a=$(grep -c "^psql.*ERROR" /tmp/v2.err || true)
          [ "$a" -eq 2 ] || { echo "::error::expected 2 auth rejections, got $a"; cat /tmp/v2.err; exit 1; }
          grep -q "^UPDATE 0" /tmp/v2.out || { echo "::error::magic link consumable twice"; exit 1; }
          echo "✅ schema constraints enforce correctly (V1: 6, V2: single-use + rotation)"

      - name: Build & test
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5433/dsapp_it
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: ./gradlew build --no-daemon

      - name: API contract drift gate
        working-directory: backend
        run: |
          # Boot the app and assert the live spec matches the committed baseline,
          # so backend and Flutter DTOs cannot silently diverge (M0 exit criterion).
          ./gradlew bootRun --no-daemon &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8082/actuator/health >/dev/null 2>&1 && break
            sleep 2
          done
          API_BASE_URL=http://localhost:8082 ./contract/check_contract.sh
        env:
          DB_URL: jdbc:postgresql://localhost:5433/dsapp_it
          DB_USER: postgres
          DB_PASSWORD: postgres

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/

  flutter:
    name: Flutter (Android + Web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'   # frozen: see docs/adr/ADR-0001
          channel: stable

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test
      - name: Build Web
        run: flutter build web --release
      - name: Build Android
        run: flutter build apk --debug
