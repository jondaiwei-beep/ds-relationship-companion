# dsapp staging, direct origin (no Cloudflare). For phones on networks where
# the Cloudflare edge is unreachable; the App falls back to this host.
server {
    listen 80;
    server_name ds-api-direct.beforeweplay.com;
    location /.well-known/acme-challenge/ { root /opt/applications/dsapp/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name ds-api-direct.beforeweplay.com;
    ssl_certificate     /etc/letsencrypt/live/ds-api-direct.beforeweplay.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ds-api-direct.beforeweplay.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}
