# nginx for the D/s Companion — Flutter Web + backend API.
#
# CRITICAL (xmatch incident 2026-08-14): API paths are matched BEFORE any
# redirect rule. A blanket `return 301` downgraded App POST /api/login to GET,
# dropped the body, and caused a 2-hour login outage. `location` blocks are
# evaluated before server-level `if`, so API routes must appear first.
#
# Verify with:
#   python3 engine/nginx_redirect_gate.py check --file ops/nginx-dsapp.conf
#   python3 engine/nginx_redirect_gate.py probe --host <domain>
#   -> POST /v1/... must report num_redirects == 0

server {
    listen 443 ssl http2;
    server_name app.example.com;

    root /opt/applications/dsapp/web;
    index index.html;

    # --- API first, and exempt from every redirect below -------------------
    location ~ ^/(v1|actuator)/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Never let the SPA fallback swallow these.
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # --- Static assets ------------------------------------------------------
    # Matched by EXTENSION, not by "contains a dot". Invite tokens look like
    # `iv1.abc…`, so a dot-based rule would 404 every invite link.
    # Hashed build output can cache hard; index.html must not.
    location ~* \.(js|css|woff2?|ttf|png|jpg|jpeg|svg|wasm|json|map|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA fallback -------------------------------------------------------
    # Required for nested-route refresh and direct URL entry: /invite/{token},
    # /occurrences/{id} and /auth/callback must all return index.html with 200,
    # never 404 (Notion 04 §13).
    location / {
        try_files $uri $uri/ /index.html;

        # Notion 04 §5: a magic-link or invite token must never leak to a third
        # party through the Referer header.
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        # index.html must revalidate so a deploy is picked up immediately.
        add_header Cache-Control "no-store" always;
    }
}
