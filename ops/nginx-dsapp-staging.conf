# dsapp staging. Cloudflare terminates TLS; origin serves plain HTTP on :80.
#
# CRITICAL (xmatch incident 2026-08-14): API paths match BEFORE any redirect.
# A blanket 301 downgraded App POST to GET, dropped the body, and caused a
# 2-hour login outage. location blocks are evaluated before server-level if.

# --- API origin ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /opt/applications/dsapp/cert/origin.crt;
    ssl_certificate_key /opt/applications/dsapp/cert/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name ds-api.beforeweplay.com;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }
}

# --- Flutter Web companion ---
server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /opt/applications/dsapp/cert/origin.crt;
    ssl_certificate_key /opt/applications/dsapp/cert/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_name ds-staging.beforeweplay.com;
    root /opt/applications/dsapp/web;
    index index.html;

    # Assets matched by EXTENSION, never by "contains a dot": invite tokens
    # look like iv1.abc..., so a dot-based rule would 404 every invite link.
    location ~* \.(js|css|woff2?|ttf|otf|png|jpg|jpeg|svg|wasm|json|map|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: /invite/{token}, /occurrences/{id} and /auth/callback must
    # return index.html with 200 so nested-route refresh and direct URL work.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Cache-Control "no-store" always;
    }
}
