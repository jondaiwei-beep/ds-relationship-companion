# Tests run against the developer's local PostgreSQL 16 on port 5433.
# No Docker / Testcontainers: the local instance is already provisioned
# (see backend/README.md). CI provisions the same via a postgres service.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5433/dsapp_it}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      connection-init-sql: "SET TIME ZONE 'UTC'"
      maximum-pool-size: 12
  flyway:
    enabled: true
    clean-disabled: false
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES

# Background jobs are DISABLED in tests. Otherwise the scheduler races the
# test: it can claim and send an outbox record between the arrange and assert
# steps, producing failures that have nothing to do with the code under test.
# Each test drives the dispatcher and generator explicitly instead.
dsapp:
  delivery:
    enabled: false
  generation:
    enabled: false
