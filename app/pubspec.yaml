name: ds_relationship_companion
description: Shared V5 Warm Authority design-system foundation for Android and Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ">=2.0.10 <3.0.0"

dev_dependencies:
  flutter_lints: ">=5.0.0 <7.0.0"
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: false
  assets:
    - assets/svg/
    - assets/textures/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/cormorant-garamond/CormorantGaramond-Regular.ttf
          weight: 400
        - asset: assets/fonts/cormorant-garamond/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/cormorant-garamond/CormorantGaramond-SemiBold.ttf
          weight: 600
